- name: Franziska Boenisch
  title: CISPA Helmholtz Center
  image: images/optimized/speakers-600x600/FranziskaBoenisch.webp
  bio: >-
    Franziska is a tenure-track faculty at the CISPA Helmholtz Center for Information Security, where she co-leads the SprintML lab. 
    
    Her research focuses on private and trustworthy machine learning. During her Ph.D. at Freie Universität Berlin and Fraunhofer AISEC, she pioneered the notion of individualized privacy in ML. Before joining CISPA, she was a Postdoctoral Fellow at the University of Toronto and the Vector Institute. 
    
    Franziska is the recipient of an ERC Starting Grant (2025) for research on privacy in foundation models, and her work has been recognised with the Fraunhofer ICT Dissertation Award (2023), GI Junior Fellowship (2024), and Werner-von-Siemens Fellowship (2025). 

- name: Dominik Janzing
  image: images/optimized/speakers-600x600/DominikJanzing.webp
  title: Amazon
  bio: >-
    Dominik Janzing is a Principal Research Scientist at Amazon in Tübingen, Germany, where he works on new approaches to causal inference for cloud computing, for example in root cause analysis of anomalies. He is particularly interested in the foundations of causal inference and in defining formal concepts that are both practically useful and domain-independent. 
    
    In addition to his research at Amazon, Dominik teaches seminars on causality at the Karlsruhe Institute of Technology (KIT).

- name: Wojciech Samek
  title: TU Berlin / Fraunhofer HHI
  image: images/optimized/speakers-600x600/WojciechSamek.webp
  bio-intro: >-
    Wojciech Samek is a Professor in the EECS Department at the Technical University of Berlin and Head of the AI Department at the Fraunhofer Heinrich Hertz Institute (HHI) in Berlin, Germany. He earned a Dipl.-Inf. degree in Computer Science from Humboldt University of Berlin in 2010 and a Ph.D. (with honors) from TU Berlin in 2014. 
  bio-more: >-
    After his doctorate, he founded the Machine Learning Group at Fraunhofer HHI, which became an independent department in 2021. He is a Fellow at BIFOLD – the Berlin Institute for the Foundation of Learning and Data – and the ELLIS Unit Berlin. He serves as a member of Germany’s Platform for AI and sits on advisory and executive boards including the WUT Center for Credible AI, AGH University’s AI Center, IDEAS Research Institute, HEIBRiDS, and the DAAD Konrad Zuse School ELIZA. His research focuses on explainable AI (XAI), spanning methods, theory, and applications, with pioneering contributions including Layer-wise Relevance Propagation (LRP), concept-level explainability, evaluation of explanations, and XAI-driven model and data improvement. He has served as Senior Editor of IEEE TNNLS, Associate Editor for several journals, and Area Chair at NeurIPS, ICML, and NAACL. He has received multiple best paper awards (Pattern Recognition 2020, Digital Signal Processing 2022, IEEE SPS 2024, Information Fusion 2025), has co-authored over 250 peer-reviewed papers, and was recognized as a Highly Cited Researcher 2025 by Clarivate.

- name: Adam Dziedzic
  title: CISPA Helmholtz Center
  image: images/optimized/speakers-600x600/AdamDziedzic.webp
  bio-intro: >-
    Adam is a faculty member at CISPA Helmholtz Center for Information Security, co-leading the SprintML group. His research is focused on secure and trustworthy Machine Learning. Adam was a Postdoctoral Fellow at the Vector Institute and the University of Toronto, and a member of the CleverHans Lab, advised by Prof. Nicolas Papernot. 
  bio-more: >-
    He earned his PhD at the University of Chicago, where he was advised by Prof. Sanjay Krishnan and worked on input and model compression for adaptive and robust neural networks. Adam obtained his Bachelor's and Master's degrees from the Warsaw University of Technology in Poland. He was also studying at DTU (Technical University of Denmark)and carried out research at EPFL, Switzerland. Adam also worked at CERN (Geneva, Switzerland), Barclays Investment Bank in London (UK), Microsoft Research (Redmond, USA), and Google (Madison, USA).

- name: Randall Balestriero
  title: Brown University / Meta AI Research
  image: images/optimized/speakers-600x600/RandallBalestriero.webp
  bio-intro: >-
    Randall Balestriero is an Assistant Professor of Computer Science at Brown University in Providence, where he leads the Galilai Group. 
    
    He has been doing research in learnable signal processing since 2013, in particular with learnable parametrized wavelets which have then been extended for deep wavelet transforms. The latter has found many applications, e.g., in NASA's Mars rover for marsquake detection. 
  bio-more: >- 
    In 2016, when joining Rice University for a PhD with Prof. Richard Baraniuk, he broadened his scope to explore Deep Networks from a theoretical perspective by employing affine spline operators. This led him to revisit and improve state-of-the-art methods, e.g., batch-normalization or generative networks. In 2021 when joining Meta AI Research (FAIR) for a postdoc with Prof. Yann LeCun, he further enlarged his research interests e.g. to include self-supervised learning or biases emerging from data-augmentation and regularization leading to many publications and conference tutorials.

- name: Fazl Barez
  title: University of Oxford
  image: images/optimized/speakers-600x600/FazlBarez.webp
  bio-intro: >-
    Fazl Barez is a Senior Research Fellow at the University of Oxford's Martin AI Governance Initiative, where he serves as Principal Investigator leading research on AI safety, interpretability and governance.
    His work focuses on mechanistic interpretability of large models, safety evaluations, deceptive behaviours, and techniques such as model editing and machine unlearning. A central theme of his research is moving from observing model behaviour to understanding and systematically improving it.
  bio-more: >-
    Alongside his academic work, Fazl is involved in Martian, an independent research group focused on understanding machine intelligence from first principles. The team brings together researchers with experience across major AI labs, including Anthropic, Google DeepMind, and Meta, combining frontier-model research with long-term safety perspectives.
    His broader experience spans academic research, frontier AI labs, and international initiatives on AI risk and reliability — a perspective closely aligned with this year’s focus on reliability and safety.

