- name: Franziska Boenisch
  title: CISPA Helmholtz Center
  image: images/optimized/speakers-600x600/FranziskaBoenisch.webp
  bio: >-
    Franziska is a tenure-track faculty at the CISPA Helmholtz Center for Information Security, where she co-leads the SprintML lab. Her research focuses on private and trustworthy machine learning; during her Ph.D. at Freie Universität Berlin and Fraunhofer AISEC she pioneered the notion of individualized privacy in ML. Before joining CISPA, she was a Postdoctoral Fellow at the University of Toronto and the Vector Institute. She received an ERC Starting Grant in 2025 for research on privacy in foundation models and has been recognized with the Fraunhofer ICT Dissertation Award (2023), a GI Junior Fellowship (2024), and a Werner-von-Siemens Fellowship (2025).

